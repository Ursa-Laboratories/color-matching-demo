[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ursa-learning"
version = "0.1.0"
description = "Generic active learning, color optimization and overnight orchestration through CubOS HTTP APIs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.27",
  "pydantic>=2.0", "pydantic-settings>=2.0", "pyyaml>=6.0", "ruamel.yaml>=0.19.1",
  "numpy>=1.26", "scipy>=1.12", "pillow>=10", "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ursa-learning = "ursa_learning.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ursa_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
